name: Bot DOM Salvador

on:
  schedule:
    # Seg–sex, de hora em hora das 11h às 20h (horário de Brasília)
    - cron: "*/15 14-23 * * 1-5"
    # Seg–sex, às 21h (em UTC já é 00h do dia seguinte)
    - cron: "0 0 * * 2-6"
  workflow_dispatch:
    inputs:
      forcar_envio:
        description: "Reenviar a edição mesmo que já tenha sido enviada? (sim/nao)"
        default: "nao"
      diagnostico:
        description: "Mostrar o motivo de cada item? (sim/nao)"
        default: "nao"

permissions:
  contents: write

jobs:
  rodar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 pdfplumber
      - run: python bot_dom.py
        env:
          GCHAT_WEBHOOK_URL: ${{ secrets.GCHAT_WEBHOOK_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FORCAR_ENVIO: ${{ github.event.inputs.forcar_envio }}
          DIAGNOSTICO: ${{ github.event.inputs.diagnostico }}
      - name: Salvar última edição enviada
        run: |
          git config user.name "bot-dom"
          git config user.email "bot-dom@users.noreply.github.com"
          git add ultima_edicao.txt 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Edição enviada" && git push)
